repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.24
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: nbstripout
        name: Strip Jupyter notebook output
        entry: uv run nbstripout
        language: system
        types: [jupyter]

      - id: codespell
        name: Check spelling
        entry: uv run codespell
        language: system
        types_or: [markdown, python, text]
        exclude: ^data/

      - id: ruff-check
        name: ruff fix
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
